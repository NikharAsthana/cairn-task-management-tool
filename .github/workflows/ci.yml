name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API
    runs-on: ubuntu-latest

    env:
      # A workspace-wide `pnpm install` triggers every package's postinstall
      # script, including this one's `prisma generate` — before .env.test
      # gets explicitly loaded by any later step. Prisma's config loader
      # throws immediately if DATABASE_URL is unresolved at all, even
      # though `generate` itself never actually connects to a database — it
      # only needs the value to exist. This matches .env.test exactly, so
      # it's restating the same non-secret value, not introducing a second one.
      DATABASE_URL: postgresql://postgres:test@localhost:5433/cairn_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cairn_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter api run lint:ci

      - name: Typecheck
        run: pnpm --filter api run typecheck

      - name: Unit tests
        run: pnpm --filter api run test

      - name: Apply migrations to the test database
        run: pnpm --filter api run test:e2e:migrate

      - name: e2e tests
        run: pnpm --filter api run test:e2e

      - name: Build
        run: pnpm --filter api run build

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Scoped to just `web`'s own dependency graph — unlike the api job,
      # this deliberately never installs apps/api at all, so its
      # postinstall (prisma generate, which needs DATABASE_URL) never runs
      # here in the first place. Nothing to fake a value for.
      - name: Install dependencies
        run: pnpm --filter web install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web run lint

      - name: Typecheck
        run: pnpm --filter web run typecheck

      - name: Build
        run: pnpm --filter web run build
        